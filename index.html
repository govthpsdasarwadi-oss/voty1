<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice-Enabled Camera & Cloud Sync</title>

    <!-- JSZip for batch folder downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --border: #cbd5e1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Disable text selection and image drag */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        input {
            /* Re-enable text input selection for typing */
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media(min-width: 850px) {
            .container {
                grid-template-columns: 1.1fr 0.9fr;
            }
        }

        .card {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge {
            font-size: 10px;
            background: #22c55e;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* Fixed Camera Frame Area */
        .camera-viewport {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 4 Surround Panels */
        .blur-panel {
            position: absolute;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 1;
        }

        .panel-top {
            top: 0; left: 0; right: 0;
            height: calc(50% - 130px);
        }

        .panel-bottom {
            bottom: 0; left: 0; right: 0;
            height: calc(50% - 130px);
        }

        .panel-left {
            top: calc(50% - 130px);
            bottom: calc(50% - 130px);
            left: 0;
            width: calc(50% - 110px);
        }

        .panel-right {
            top: calc(50% - 130px);
            bottom: calc(50% - 130px);
            right: 0;
            width: calc(50% - 110px);
        }

        /* Clear Center Frame Box Outline */
        .frame-overlay {
            position: absolute;
            width: 220px;
            height: 260px;
            border: 2px dashed #22c55e;
            border-radius: 8px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .frame-overlay::after {
            content: "Fit Subject in Box";
            color: #22c55e;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            bottom: 8px;
        }

        /* Camera Action Row */
        .camera-action-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .btn-capture {
            flex: 2;
            background-color: var(--success);
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-retake {
            flex: 1;
            background-color: var(--warning);
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-capture:hover, .btn-retake:hover { opacity: 0.9; }
        .btn-capture:disabled, .btn-retake:disabled { background: #94a3b8; cursor: not-allowed; }

        .form-group {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            gap: 6px;
        }

        input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        input:focus {
            border-color: var(--primary);
        }

        /* Toggle Password Button */
        .btn-toggle-pwd {
            padding: 0 12px;
            background-color: #f1f5f9;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-toggle-pwd:hover {
            background-color: #e2e8f0;
        }

        /* Microphone Button */
        .btn-mic {
            padding: 0 14px;
            background-color: #f1f5f9;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-mic:hover {
            background-color: #e2e8f0;
        }

        .btn-mic.listening {
            background-color: #fee2e2;
            border-color: var(--danger);
            color: var(--danger);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Folder List & Gallery */
        .folder-tree {
            max-height: 520px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .folder-group {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            background: #f8fafc;
        }

        .folder-header {
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .folder-actions {
            display: flex;
            gap: 6px;
        }

        .mini-btn {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        .grid-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 6px;
        }

        .photo-card {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: white;
        }

        .photo-card img {
            width: 100%;
            height: 85px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            pointer-events: auto;
        }

        .photo-card .photo-label {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #edf2f7;
            color: var(--text);
        }

        /* Individual Photo Delete Overlay */
        .photo-card .btn-delete-single {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(220, 38, 38, 0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            transition: background 0.2s;
        }

        .photo-card .btn-delete-single:hover {
            background: var(--danger);
        }

        .empty-state {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            padding: 40px 10px;
        }

        /* Modal Preview */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
        }

        /* App Lock Screen Overlay */
        .lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f172a;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: white;
            text-align: center;
        }

        .lock-box {
            background: #1e293b;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lock-box h3 {
            font-size: 1.25rem;
            color: #f8fafc;
        }

        .lock-box input {
            text-align: center;
            letter-spacing: 4px;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
        }

        .btn-unlock {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-unlock:hover {
            background: var(--primary-hover);
        }

        .lock-error {
            color: #ef4444;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<!-- APP LOCK SCREEN OVERLAY -->
<div class="lock-screen" id="lockScreen">
    <div class="lock-box">
        <div style="font-size: 32px;">🔒</div>
        <h3>App Protection</h3>
        <p style="font-size: 12px; color: #94a3b8;">Enter PIN to open camera app</p>
        <div class="input-row">
            <input type="password" id="passcodeInput" placeholder="Enter PIN" maxlength="12" onkeydown="if(event.key==='Enter') unlockApp()">
            <button class="btn-toggle-pwd" type="button" onclick="togglePasswordVisibility('passcodeInput', this)" title="Show/Hide PIN">👁️</button>
        </div>
        <div class="lock-error" id="lockError">Incorrect PIN!</div>
        <button class="btn-unlock" onclick="unlockApp()">🔓 Unlock App</button>
    </div>
</div>

<div class="container">
    <!-- Camera Section -->
    <div class="card">
        <h2>
            <span>📷 Fixed Frame Capture</span>
            <div>
                <button class="mini-btn" style="background:#334155; color:white; border:none; margin-right:4px;" onclick="lockApp()">🔒 Lock</button>
                <span class="status-badge" id="cloudStatus">☁️ Cloud Active</span>
            </div>
        </h2>
        
        <div class="camera-viewport" id="viewport">
            <video id="cameraVideo" autoplay playsinline muted></video>
            
            <!-- 4 Surround Panels -->
            <div class="blur-panel panel-top"></div>
            <div class="blur-panel panel-bottom"></div>
            <div class="blur-panel panel-left"></div>
            <div class="blur-panel panel-right"></div>

            <div class="frame-overlay" id="cropFrame"></div>
        </div>

        <!-- Capture & Retake Button Row -->
        <div class="camera-action-row">
            <button class="btn-capture" id="captureBtn" onclick="captureFramedPhoto()">📸 Capture & Upload</button>
            <button class="btn-retake" id="retakeBtn" onclick="retakePhoto()">🔄 Retake</button>
        </div>

        <!-- Folder Name with Mic Dictation -->
        <div class="form-group">
            <label for="folderName">📁 Town/ Village Name:</label>
            <div class="input-row">
                <input type="text" id="folderName" placeholder="Type or speak folder name (e.g. Ward 1)" value="Ward_01">
                <button type="button" class="btn-mic" id="micFolderBtn" onclick="toggleVoiceInput('folderName', 'micFolderBtn')" title="Speak Folder Name">🎙️</button>
            </div>
        </div>

        <!-- Category Name with Mic Dictation -->
        <div class="form-group">
            <label for="categoryName">🏷️ School/College Name:</label>
            <div class="input-row">
                <input type="text" id="categoryName" placeholder="Type or speak category (e.g. Verified, Family A)" value="Verified">
                <button type="button" class="btn-mic" id="micCategoryBtn" onclick="toggleVoiceInput('categoryName', 'micCategoryBtn')" title="Speak Category Name">🎙️</button>
            </div>
        </div>

        <!-- Classification Sub-Folder with Mic Dictation -->
        <div class="form-group">
            <label for="classificationName">📂 Class:</label>
            <div class="input-row">
                <input type="text" id="classificationName" placeholder="Type or speak classification (e.g. Group_A, Type_1)" value="Class_01">
                <button type="button" class="btn-mic" id="micClassBtn" onclick="toggleVoiceInput('classificationName', 'micClassBtn')" title="Speak Classification Name">🎙️</button>
            </div>
        </div>

        <!-- Strictly Numeric Serial Number -->
        <div class="form-group">
            <label for="serialNumberInput">🔢 Image Serial Number (Digits Only):</label>
            <input type="number" id="serialNumberInput" placeholder="e.g. 101" value="1" min="1" step="1" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
    </div>

    <!-- Storage View Across All Devices -->
    <div class="card">
        <h2>
            <span>📁 Accessible Cloud Folders</span>
            <button class="mini-btn" style="background:var(--primary); color:white; border:none;" onclick="downloadAllAsZip()">📦 Download All (ZIP)</button>
        </h2>
        
        <div class="folder-tree" id="galleryView">
            <div class="empty-state">Loading cloud storage...</div>
        </div>
    </div>
</div>

<!-- Preview Modal -->
<div class="modal" id="imgModal" onclick="this.style.display='none'">
    <img id="modalImg" src="" alt="Full View">
</div>

<!-- Firebase Modular Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAQZu-uf-S4NccvuO6Zgm_b5irREW_MaQs",
      authDomain: "voty-4df98.firebaseapp.com",
      databaseURL: "https://voty-4df98-default-rtdb.firebaseio.com",
      projectId: "voty-4df98",
      storageBucket: "voty-4df98.firebasestorage.app",
      messagingSenderId: "687683066956",
      appId: "1:687683066956:web:88c1c0422d92c7457e28e9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const photosRef = ref(db, 'synced_folders');

    window.cloudPhotos = {};

    // Live Sync Listener across all connected devices
    onValue(photosRef, (snapshot) => {
        const data = snapshot.val();
        window.cloudPhotos = data || {};
        renderFolderGallery();
    });

    // Save numeric photo into Cloud DB under Folder + Category + Classification
    window.uploadPhotoToCloud = async function(folderPath, numericName, base64Data) {
        const cleanPath = folderPath.replace(/[.\#\$\[\]\/]/g, '_');
        const fileKey = 'img_' + numericName;

        const targetRef = ref(db, `synced_folders/${cleanPath}/${fileKey}`);
        await set(targetRef, {
            name: `${numericName}.jpg`,
            numericId: parseInt(numericName, 10),
            dataUrl: base64Data,
            timestamp: Date.now()
        });
    };

    // Delete single image
    window.deleteSingleImageFromCloud = async function(folderPath, fileKey) {
        if(confirm(`Delete image "${fileKey.replace('img_', '')}.jpg"?`)) {
            const imageRef = ref(db, `synced_folders/${folderPath}/${fileKey}`);
            await remove(imageRef);
        }
    };

    // Delete folder
    window.deleteFolderFromCloud = async function(folderPath) {
        if(confirm(`Delete entire directory "${folderPath}" across all devices?`)) {
            const folderRef = ref(db, `synced_folders/${folderPath}`);
            await remove(folderRef);
        }
    };
</script>

<script>
    const video = document.getElementById('cameraVideo');
    const viewport = document.getElementById('viewport');
    const cropFrame = document.getElementById('cropFrame');
    let activeRecognition = null;

    // --- DISABLE RIGHT CLICK & INSPECT SHORTCUTS ---
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    
    document.addEventListener('keydown', (e) => {
        // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
            (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
        ) {
            e.preventDefault();
            return false;
        }
    });

    // --- APP LOCK MANAGEMENT ---
    const HARDCODED_PIN = "3632";

    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.innerText = "🙈";
        } else {
            input.type = "password";
            btn.innerText = "👁️";
        }
    }

    function unlockApp() {
        const input = document.getElementById('passcodeInput');
        const errorMsg = document.getElementById('lockError');
        
        if (input.value === HARDCODED_PIN) {
            document.getElementById('lockScreen').style.display = 'none';
            errorMsg.style.display = 'none';
            input.value = '';
            startCamera();
        } else {
            errorMsg.style.display = 'block';
            input.value = '';
            input.focus();
        }
    }

    function lockApp() {
        document.getElementById('lockScreen').style.display = 'flex';
        document.getElementById('passcodeInput').focus();
    }

    // Microphone Voice Recognition (Web Speech API)
    function toggleVoiceInput(targetInputId, btnId) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Speech recognition is not supported on this browser version.");
            return;
        }

        const btn = document.getElementById(btnId);
        const input = document.getElementById(targetInputId);

        if (activeRecognition) {
            activeRecognition.stop();
            activeRecognition = null;
            btn.classList.remove('listening');
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function() {
            btn.classList.add('listening');
        };

        recognition.onresult = function(event) {
            let spokenText = event.results[0][0].transcript.trim();
            spokenText = spokenText.replace(/[^a-zA-Z0-9_\- ]/g, '').replace(/\s+/g, '_');
            if (spokenText) {
                input.value = spokenText;
            }
        };

        recognition.onerror = function(event) {
            console.error("Speech Recognition Error: ", event.error);
            btn.classList.remove('listening');
            activeRecognition = null;
        };

        recognition.onend = function() {
            btn.classList.remove('listening');
            activeRecognition = null;
        };

        activeRecognition = recognition;
        recognition.start();
    }

    // Initialize Camera Stream
    async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("Camera access requires HTTPS or localhost.");
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                video.srcObject = fallbackStream;
            } catch (fallbackErr) {
                alert("Unable to access camera: " + fallbackErr.message);
            }
        }
    }

    // Retake Photo Functionality
    function retakePhoto() {
        viewport.style.opacity = '0.3';
        setTimeout(() => {
            viewport.style.opacity = '1';
        }, 150);
    }

    // Crop within Fixed Frame & Upload
    async function captureFramedPhoto() {
        const folder = document.getElementById('folderName').value.trim() || 'General';
        const category = document.getElementById('categoryName').value.trim() || 'Default';
        const classification = document.getElementById('classificationName').value.trim() || 'Unclassified';
        const serialInput = document.getElementById('serialNumberInput');
        let currentSerial = serialInput.value.replace(/\D/g, '');

        if (!currentSerial) {
            alert("Please provide a numeric serial number.");
            return;
        }

        if (!video.videoWidth) {
            alert("Camera feed loading. Please wait.");
            return;
        }

        const captureBtn = document.getElementById('captureBtn');
        captureBtn.disabled = true;
        captureBtn.innerText = "⏳ Uploading...";

        // Precise frame calculations
        const vpRect = viewport.getBoundingClientRect();
        const frameRect = cropFrame.getBoundingClientRect();

        const scaleX = video.videoWidth / vpRect.width;
        const scaleY = video.videoHeight / vpRect.height;

        const cropX = (frameRect.left - vpRect.left) * scaleX;
        const cropY = (frameRect.top - vpRect.top) * scaleY;
        const cropWidth = frameRect.width * scaleX;
        const cropHeight = frameRect.height * scaleY;

        // Render cropped canvas
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 380;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(
            video,
            cropX, cropY, cropWidth, cropHeight,
            0, 0, canvas.width, canvas.height
        );

        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        const folderPath = `${folder}_${category}_${classification}`;

        try {
            if (typeof window.uploadPhotoToCloud === 'function') {
                await window.uploadPhotoToCloud(folderPath, currentSerial, dataUrl);
                serialInput.value = parseInt(currentSerial, 10) + 1;
            }
        } catch(e) {
            alert("Upload failed: " + e.message);
        } finally {
            captureBtn.disabled = false;
            captureBtn.innerText = "📸 Capture & Upload";
        }
    }

    // Render Gallery Previews
    function renderFolderGallery() {
        const container = document.getElementById('galleryView');
        const folders = Object.keys(window.cloudPhotos || {});

        if (folders.length === 0) {
            container.innerHTML = `<div class="empty-state">No photos saved yet. Snap a photo to view across all devices!</div>`;
            return;
        }

        container.innerHTML = '';

        folders.forEach(folderPath => {
            const photosObj = window.cloudPhotos[folderPath] || {};
            const photoKeys = Object.keys(photosObj);

            // Sort purely by numeric serial order
            photoKeys.sort((a, b) => {
                const numA = photosObj[a].numericId || 0;
                const numB = photosObj[b].numericId || 0;
                return numA - numB;
            });

            const group = document.createElement('div');
            group.className = 'folder-group';

            group.innerHTML = `
                <div class="folder-header">
                    <span>📁 <strong>${folderPath.split('_').join(' / ')}</strong> (${photoKeys.length} photos)</span>
                    <div class="folder-actions">
                        <button class="mini-btn" onclick="downloadFolderAsZip('${folderPath}')">📥 ZIP</button>
                        <button class="mini-btn" style="color:var(--danger);" onclick="window.deleteFolderFromCloud('${folderPath}')">🗑️ Folder</button>
                    </div>
                </div>
                <div class="grid-preview" id="grid-${folderPath}"></div>
            `;

            const grid = group.querySelector(`#grid-${folderPath}`);

            photoKeys.forEach(photoKey => {
                const photo = photosObj[photoKey];
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <button class="btn-delete-single" onclick="window.deleteSingleImageFromCloud('${folderPath}', '${photoKey}')" title="Delete Image">✕</button>
                    <img src="${photo.dataUrl}" alt="${photo.name}" onclick="openPreview('${photo.dataUrl}')" oncontextmenu="return false;">
                    <div class="photo-label">${photo.name}</div>
                `;
                grid.appendChild(card);
            });

            container.appendChild(group);
        });
    }

    function openPreview(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imgModal').style.display = 'flex';
    }

    // Download Single Folder as ZIP
    async function downloadFolderAsZip(folderPath) {
        const zip = new JSZip();
        const photosObj = window.cloudPhotos[folderPath] || {};
        
        Object.values(photosObj).forEach(photo => {
            const base64Data = photo.dataUrl.split(',')[1];
            zip.file(photo.name, base64Data, { base64: true });
        });

        const content = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = `${folderPath}_Photos.zip`;
        a.click();
    }

    // Download All Folders as structured ZIP
    async function downloadAllAsZip() {
        const zip = new JSZip();
        const folders = Object.keys(window.cloudPhotos || {});

        if (folders.length === 0) {
            alert("No photos to download!");
            return;
        }

        folders.forEach(folderPath => {
            const parts = folderPath.split('_');
            const subFolderPath = parts.join('/');
            const folderZip = zip.folder(subFolderPath);
            const photosObj = window.cloudPhotos[folderPath] || {};
            
            Object.values(photosObj).forEach(photo => {
                const base64Data = photo.dataUrl.split(',')[1];
                folderZip.file(photo.name, base64Data, { base64: true });
            });
        });

        const content = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = `All_Photos_Export_${Date.now()}.zip`;
        a.click();
    }

    // Auto-focus passcode field on load
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('passcodeInput').focus();
    });
</script>
</body>
